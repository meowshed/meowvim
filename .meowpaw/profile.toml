# What this repository declares to the harness. Every section is optional: a
# unit whose section is absent reports what it can't do and does nothing in its
# place. Fill each value from what the repository already does, never from what
# it might do.

# One command per verification verb, each run by the shell from the
# repository's root. Leave out a verb the repository has no command for, and
# the harness reports it as unresolved.
[verbs]
format = "stylua --check lua/ init.lua"
lint = "luacheck lua/ init.lua"
test = "bash bin/test-config.sh"

# The commit convention the history already follows: the longest subject, the
# trailers every commit carries, and each type with what it means for a
# release.
[commits]
subject_limit = 72
trailers = []

[commits.types]
feat = "minor"
fix = "patch"
perf = "patch"
docs = "none"
refactor = "none"
chore = "none"
test = "none"
style = "none"
ci = "none"

# The branch nobody commits to directly, and whether every pushed commit must
# carry a verified signature.
[git]
trunk = "main"
require_signatures = false

# The tracker the record is projected onto.
[tracker]
kind = "github"

# The language prose is written in.
[prose]
language = "en-GB"
